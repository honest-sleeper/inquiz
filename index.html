<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>身内クイズゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1>身内クイズゲーム</h1>
      <div class="score-area">SCORE <span id="score">0</span></div>
    </header>

    <section id="login-screen" class="screen active">
      <div class="panel">
        <h2>ゲーム開始</h2>
        <p class="description">身内用アクセスコードを入力してください。</p>
        <input type="text" id="access-code" class="text-input" placeholder="アクセスコード" autocomplete="off">
        <button id="start-button" class="main-button">ゲーム開始</button>
        <p id="login-message" class="message"></p>
      </div>
    </section>

    <section id="genre-screen" class="screen">
      <div class="panel">
        <h2>ジャンルを選択</h2>
        <p class="description">挑戦するジャンルを選んでください。</p>
        <div id="genre-list" class="genre-list"></div>
        <p id="genre-message" class="message"></p>
      </div>
    </section>

    <section id="quiz-screen" class="screen">
      <div class="quiz-panel">
        <div class="quiz-info">
          <div>ジャンル：<span id="quiz-genre">---</span></div>
          <div>POINT：<span id="quiz-point">0</span></div>
        </div>

        <div class="timer-area">
          <div class="timer-label">残り時間</div>
          <div id="timer" class="timer">10</div>
        </div>

        <div class="question-box">
          <div class="question-label">QUESTION</div>
          <div id="question-text" class="question-text">問題を読み込み中……</div>
        </div>

        <div id="answer-area" class="answer-area hidden">
          <div class="answer-label">ANSWER</div>
          <div id="answer-text" class="answer-text">---</div>
        </div>

        <div id="judge-area" class="judge-area hidden">
          <p class="judge-description">自分の答えは正解でしたか？</p>
          <div class="judge-buttons">
            <button id="correct-button" class="judge-button correct">○ 正解</button>
            <button id="wrong-button" class="judge-button wrong">× 不正解</button>
          </div>
        </div>

        <p id="quiz-message" class="message"></p>
      </div>
    </section>

    <section id="result-screen" class="screen">
      <div class="panel result-panel">
        <h2>ゲーム終了</h2>
        <p class="result-title">最終スコア</p>
        <div id="final-score" class="final-score">0</div>
        <button id="restart-button" class="main-button">もう一度遊ぶ</button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
